<!-- @dsCard group="Status" height=101 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProgressBar</title></head>
<body>
<div class="ds-stack ds-panel ds-narrow">
  <div class="progress-row"><div class="progress" role="progressbar" aria-label="Tier progress" aria-valuenow="3" aria-valuemin="0" aria-valuemax="5"><span style="--value:60%"></span></div><span class="num">3 of 5 passes</span></div>
  <div class="progress-row"><div class="progress is-complete" role="progressbar" aria-label="Tier progress" aria-valuenow="5" aria-valuemin="0" aria-valuemax="5"><span style="--value:100%"></span></div><span class="num">Mastered</span></div>
  <div class="progress-row" style="--cols:52px 1fr 40px"><span>Treble</span><div class="progress" role="progressbar" aria-label="Treble accuracy" aria-valuenow="96" aria-valuemin="0" aria-valuemax="100"><span style="--value:96%"></span></div><span class="num">96%</span></div>
</div>
</body>
</html>
