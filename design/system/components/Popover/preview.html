<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Popover</title></head>
<body>
<div class="ds-row" style="align-items:end;justify-content:center;background:var(--surface-canvas)">
  <div class="popover" role="dialog" aria-label="Keyboard display">
    <div class="switch-row"><label class="switch-label" for="p-pv1"><span>Note names on the keys</span></label><button class="switch" id="p-pv1" role="switch" aria-checked="true"></button></div>
    <div class="switch-row"><label class="switch-label" for="p-pv2"><span>Computer-key hints</span><small>Show A S D F on the keys</small></label><button class="switch" id="p-pv2" role="switch" aria-checked="false"></button></div>
    <div class="field"><span class="field-label" id="p-pv3">Keyboard view</span><div class="segmented" role="radiogroup" aria-labelledby="p-pv3"><button role="radio" aria-checked="true">Fit exercise</button><button role="radio" aria-checked="false">Full keyboard</button></div></div>
  </div>
</div>
</body>
</html>
