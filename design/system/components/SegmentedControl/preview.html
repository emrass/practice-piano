<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SegmentedControl</title></head>
<body>
<div class="ds-stack ds-sheet">
  <div class="segmented" role="radiogroup" aria-label="Lesson" style="max-width:560px">
    <button role="radio" aria-checked="true">Sight reading</button><button role="radio" aria-checked="false">Ear</button><button role="radio" aria-checked="false">Rhythm</button><button role="radio" aria-checked="false">Scales</button><button role="radio" aria-checked="false">Chords</button>
  </div>
  <div class="segmented" role="radiogroup" aria-label="Practice mode" style="width:140px">
    <button role="radio" aria-checked="false">Wait</button><button role="radio" aria-checked="true">Flow</button>
  </div>
  <div class="segmented" role="radiogroup" aria-label="Hands (disabled)" style="width:240px">
    <button role="radio" aria-checked="true" disabled>RH</button><button role="radio" aria-checked="false" disabled>LH</button><button role="radio" aria-checked="false" disabled>Both</button>
  </div>
</div>
</body>
</html>
