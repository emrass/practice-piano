<!-- @dsCard group="Actions" height=68 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IconButton</title></head>
<body>
<div class="ds-row ds-sheet">
  <button class="icon-btn" aria-label="Switch to dark theme"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 11.6A6.5 6.5 0 1 1 8.4 4a5.2 5.2 0 0 0 7.6 7.6z"/></svg></button>
  <button class="icon-btn" aria-label="Settings"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
  <button class="icon-btn icon-btn-bare" aria-label="Close"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  <button class="icon-btn icon-btn-sm" aria-label="Keyboard guide" aria-pressed="true"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="1.5"/><path d="M7.5 4v12M12.5 4v12"/><rect fill="currentColor" stroke="none" x="8.3" y="9" width="3.4" height="6.2"/></svg></button>
  <button class="icon-btn icon-btn-sm" aria-label="Keyboard guide" aria-disabled="true" title="Off in ear training: find the notes by ear."><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="1.5"/><path d="M7.5 4v12M12.5 4v12"/></svg></button>
  <button class="icon-btn icon-btn-sm" aria-label="Key sound" disabled><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" stroke="none" d="M3 7.5h3l4-3.5v12l-4-3.5H3z"/><path d="M13.2 7.6l4.4 4.8M17.6 7.6l-4.4 4.8"/></svg></button>
</div>
</body>
</html>
