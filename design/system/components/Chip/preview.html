<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Chip</title></head>
<body>
<div class="ds-row ds-sheet">
  <span class="chip" title="Daily practice streak"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" stroke="none" d="M10 2.5l6 7.5-6 7.5L4 10z"/></svg> 6 days</span>
  <span class="chip chip-reward" title="Experience points">12,480 XP</span>
  <button class="chip" aria-haspopup="dialog" title="Piano &amp; audio settings" style="max-width:230px"><span class="status-dot is-on" aria-hidden="true"></span><span class="chip-text">Roland FP-30X</span></button>
  <button class="chip" aria-haspopup="dialog"><span class="status-dot" aria-hidden="true"></span><span class="chip-text">No piano connected</span></button>
</div>
</body>
</html>
