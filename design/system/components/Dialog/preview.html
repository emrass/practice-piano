<!-- @dsCard group="Surfaces" height=816 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog</title></head>
<body>
<div class="ds-contain" style="height:360px;background:var(--surface-canvas)">
  <div class="scrim">
    <div class="dialog dialog-stepped" role="dialog" aria-modal="true" aria-labelledby="p-dlg-t" style="width:min(480px,100%);height:320px">
      <div class="dialog-head"><div><p class="dialog-eyebrow">Step 2 of 4</p><h2 class="dialog-title" id="p-dlg-t">Connect your piano</h2></div><button class="icon-btn icon-btn-bare" aria-label="Close setup"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
      <div class="dialog-body"><p>Plug the piano into this device with a USB cable, or pair it over Bluetooth, then play any key.</p><div class="callout callout-success"><span class="callout-title"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg> We hear you</span><span>Roland FP-30X is connected.</span></div></div>
      <div class="dialog-actions"><button class="btn btn-ghost">Skip</button><button class="btn">Back</button><button class="btn btn-primary">Next</button></div>
    </div>
  </div>
</div>
<div class="ds-contain" style="height:440px;margin-top:16px;background:var(--surface-canvas)">
  <div class="scrim">
    <div class="dialog dialog-tabbed" role="dialog" aria-modal="true" aria-labelledby="p-dlg-t2" style="height:400px">
      <div class="dialog-head"><h2 class="dialog-title" id="p-dlg-t2">Piano &amp; audio</h2><div class="dialog-head-actions"><button class="btn btn-sm">Setup guide</button><button class="icon-btn icon-btn-bare" aria-label="Close Piano &amp; audio"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div></div>
      <div class="tabs" role="tablist" aria-label="Piano &amp; audio"><button role="tab" aria-selected="true">Piano</button><button role="tab" aria-selected="false">Audio &amp; timing</button><button role="tab" aria-selected="false">Playing</button></div>
      <div class="dialog-body" role="tabpanel"><div class="field"><label class="field-label" for="p-dlg-dev">Device</label><select class="select" id="p-dlg-dev"><option>Auto (all connected inputs)</option></select></div><p class="field-hint">The dialog keeps the height of its tallest tab.</p></div>
    </div>
  </div>
</div>
</body>
</html>
