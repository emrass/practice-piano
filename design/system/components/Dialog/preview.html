<!-- @dsCard group="Surfaces" height=360 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog</title></head>
<body>
<div class="ds-contain" style="height:360px;background:var(--surface-canvas)">
  <div class="scrim">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="p-dlg-t" style="width:min(480px,100%)">
      <div class="dialog-head"><div><p class="dialog-eyebrow">Step 2 of 4</p><h2 class="dialog-title" id="p-dlg-t">Connect your piano</h2></div><button class="icon-btn icon-btn-bare" aria-label="Close setup"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
      <div class="dialog-body"><p>Plug the piano into this device with a USB cable, or pair it over Bluetooth, then play any key.</p><div class="callout callout-success"><span class="callout-title"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg> We hear you</span><span>Roland FP-30X is connected.</span></div></div>
      <div class="dialog-actions"><button class="btn btn-ghost">Skip setup</button><button class="btn">Back</button><button class="btn btn-primary">Continue</button></div>
    </div>
  </div>
</div>
</body>
</html>
