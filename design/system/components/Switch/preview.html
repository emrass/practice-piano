<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Switch</title></head>
<body>
<div class="ds-stack ds-panel ds-narrow">
  <div class="switch-row"><label class="switch-label" for="p-s1"><span>Note names on the keys</span></label><button class="switch" id="p-s1" role="switch" aria-checked="true"></button></div>
  <div class="switch-row"><label class="switch-label" for="p-s2"><span>Computer-key hints</span><small>Show A S D F on the keys</small></label><button class="switch" id="p-s2" role="switch" aria-checked="false"></button></div>
  <div class="switch-row is-disabled"><label class="switch-label" for="p-s3"><span>Keyboard guide</span><small>Off in ear training: find the notes by ear</small></label><button class="switch" id="p-s3" role="switch" aria-checked="false" disabled></button></div>
</div>
</body>
</html>
