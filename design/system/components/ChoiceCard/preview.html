<!-- @dsCard group="Inputs" height=208 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ChoiceCard</title></head>
<body>
<div class="ds-stack ds-card" style="max-width:440px;gap:var(--space-6)" role="radiogroup" aria-label="Where are you at?">
  <button class="choice" role="radio" aria-checked="false"><b>New to the piano</b><span>Start with five notes in one hand.</span></button>
  <button class="choice" role="radio" aria-checked="true"><b>I can read a little</b><span>Both clefs, simple rhythms, hands apart.</span></button>
  <button class="choice" role="radio" aria-checked="false"><b>I play already</b><span>Hands together, key signatures, moving parts.</span></button>
</div>
</body>
</html>
