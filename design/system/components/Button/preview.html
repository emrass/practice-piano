<!-- @dsCard group="Actions" height=168 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="ds-stack ds-card">
  <div class="ds-row" style="padding:0">
    <button class="btn btn-primary btn-lg">Start <kbd>Space</kbd></button>
    <button class="btn btn-inverse btn-lg">Stop <kbd>Space</kbd></button>
    <button class="btn btn-lg">New exercise <kbd>N</kbd></button>
  </div>
  <div class="ds-row" style="padding:0">
    <button class="btn btn-primary">Next</button>
    <button class="btn">Practice weak spots</button>
    <button class="btn" aria-pressed="true">Shuffle keys</button>
    <button class="btn btn-ghost">Skip setup</button>
    <button class="btn" disabled>Hint <kbd>?</kbd></button>
  </div>
  <div class="ds-row" style="padding:0">
    <button class="btn btn-sm">Measure again</button>
    <button class="btn btn-sm is-nudge">Set up your piano</button>
    <button class="btn btn-ghost btn-danger-text btn-sm">Reset progress</button>
    <button class="btn btn-danger btn-sm">Reset everything</button>
  </div>
</div>
</body>
</html>
