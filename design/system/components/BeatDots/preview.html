<!-- @dsCard group="Status" height=44 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BeatDots</title></head>
<body>
<div class="ds-row ds-card" style="gap:var(--space-32)">
  <div class="beat-dots" role="img" aria-label="Beat 2 of 4"><span class="beat-dot is-downbeat"></span><span class="beat-dot is-on"></span><span class="beat-dot"></span><span class="beat-dot"></span></div>
  <div class="beat-dots is-countin" role="img" aria-label="Count-in, beat 3 of 4"><span class="beat-dot is-downbeat"></span><span class="beat-dot"></span><span class="beat-dot is-on"></span><span class="beat-dot"></span></div>
  <div class="beat-dots is-idle" role="img" aria-label="Metronome stopped"><span class="beat-dot is-downbeat"></span><span class="beat-dot"></span><span class="beat-dot"></span><span class="beat-dot"></span></div>
</div>
</body>
</html>
