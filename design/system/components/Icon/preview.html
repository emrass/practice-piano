<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Icon</title></head>
<body>
<div class="ds-row ds-card" style="gap:var(--space-8) var(--space-16);color:var(--text-muted)">
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>close</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg>menu</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.2"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>sun</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 11.6A6.5 6.5 0 1 1 8.4 4a5.2 5.2 0 0 0 7.6 7.6z"/></svg>moon</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>check</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5l5 5 5-5"/></svg>chevron-down</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5l5 5-5 5"/></svg>chevron-right</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>next</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10a5.5 5.5 0 1 0 1.8-4.1M4 3.5v3h3"/></svg>restart</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l7.5 13h-15zM10 8.2v3.6M10 14v.2"/></svg>warning</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" stroke="none" d="M10 2.5l2.3 4.9 5.3.6-3.9 3.7 1 5.3-4.7-2.6L5.3 17l1-5.3L2.4 8l5.3-.6z"/></svg>star</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" stroke="none" d="M10 2.5l6 7.5-6 7.5L4 10z"/></svg>streak</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><ellipse fill="currentColor" stroke="none" cx="7" cy="14.5" rx="2.8" ry="2.2"/><path d="M9.6 14.5V4l6 2v3"/></svg>note</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="1.5"/><path d="M7.5 4v12M12.5 4v12"/></svg>guide</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="1.5"/><path d="M7.5 4v12M12.5 4v12"/><rect fill="currentColor" stroke="none" x="8.3" y="9" width="3.4" height="6.2"/></svg>guide-on</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 14h14"/><circle fill="currentColor" stroke="none" cx="7" cy="6" r="2.2"/><circle fill="currentColor" stroke="none" cx="13" cy="14" r="2.2"/></svg>sliders</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" stroke="none" d="M3 7.5h3l4-3.5v12l-4-3.5H3z"/><path d="M13 7a4 4 0 0 1 0 6M15.5 4.8a7 7 0 0 1 0 10.4"/></svg>sound-on</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" stroke="none" d="M3 7.5h3l4-3.5v12l-4-3.5H3z"/><path d="M13.2 7.6l4.4 4.8M17.6 7.6l-4.4 4.8"/></svg>sound-off</span>
  <span style="display:inline-flex;align-items:center;gap:var(--space-6);width:132px;font:var(--type-caption)"><svg class="icon icon-lg" viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="5" rx="6" ry="2.2"/><path d="M4 5v10c0 1.2 2.7 2.2 6 2.2s6-1 6-2.2V5M4 10c0 1.2 2.7 2.2 6 2.2s6-1 6-2.2"/></svg>database</span>
