<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ChordChart</title></head>
<body>
<div class="ds-sheet" style="display:flex">
<div class="chord-chart" aria-label="ii–V–I in C major">
  <div class="chord-chart-title">ii–V–I in C major · from symbols · any voicing</div>
  <ol class="chord-grid" style="--bars:4">
    <li class="chord-cell is-good"><span class="chord-cell-symbol">Dm7</span><span class="chord-cell-numeral">ii7</span><span class="chord-cell-mark" aria-label="right"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg></span></li>
    <li class="chord-cell is-ok"><span class="chord-cell-symbol">G7</span><span class="chord-cell-numeral">V7</span><span class="chord-cell-mark" aria-label="late">~</span></li>
    <li class="chord-cell" aria-current="true"><span class="chord-cell-symbol">Cmaj7</span><span class="chord-cell-numeral">Imaj7</span></li>
    <li class="chord-cell"><span class="chord-cell-symbol">A7</span><span class="chord-cell-numeral">V7/ii</span></li>
    <li class="chord-cell"><span class="chord-cell-symbol">Dm7</span><span class="chord-cell-numeral">ii7</span></li>
    <li class="chord-cell"><span class="chord-cell-symbol">G7</span><span class="chord-cell-numeral">V7</span></li>
    <li class="chord-cell"><span class="chord-cell-symbol">Cmaj7</span><span class="chord-cell-numeral">Imaj7</span></li>
    <li class="chord-cell"><span class="chord-cell-symbol">Cmaj7</span><span class="chord-cell-numeral">Imaj7</span></li>
  </ol>
  <span class="badge badge-accent">E in the bass</span>
</div>
</div>
</body>
</html>
