<!-- @dsCard group="Practice" height=222 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PracticeBar</title></head>
<body>
<div class="ds-stack">
  <div class="card practice-bar">
    <div class="practice-actions"><button class="btn btn-inverse btn-lg" style="min-width:132px">Stop <kbd>Space</kbd></button><button class="btn btn-lg">New exercise <kbd>N</kbd></button></div>
    <div class="practice-status is-wide"><div class="beat-dots" role="img" aria-label="Beat 2 of 4"><span class="beat-dot is-downbeat"></span><span class="beat-dot is-on"></span><span class="beat-dot"></span><span class="beat-dot"></span></div><p class="practice-message" role="status">Play along with the playhead</p><span class="badge badge-success practice-grade">Perfect</span></div>
    <div class="practice-stats"><dl class="stat"><dt class="stat-label">Accuracy</dt><dd class="stat-value">100%</dd></dl><dl class="stat"><dt class="stat-label">Timing</dt><dd class="stat-value">98%</dd></dl><dl class="stat"><dt class="stat-label">Streak</dt><dd class="stat-value">24</dd></dl></div>
  </div>
  <div class="card practice-bar">
    <div class="practice-actions"><button class="btn btn-primary btn-lg" style="min-width:132px">Restart <kbd>R</kbd></button><button class="btn btn-lg">Hint <kbd>?</kbd></button></div>
    <div class="practice-status is-wrong"><p class="practice-message" role="status">Not that one. Try again.</p></div>
    <div class="practice-stats"><dl class="stat"><dt class="stat-label">Accuracy</dt><dd class="stat-value">92%</dd></dl><dl class="stat"><dt class="stat-label">Wrong</dt><dd class="stat-value">1</dd></dl><dl class="stat"><dt class="stat-label">Streak</dt><dd class="stat-value">0</dd></dl></div>
  </div>
</div>
</body>
</html>
