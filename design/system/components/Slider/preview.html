<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slider</title></head>
<body>
<div class="ds-row ds-panel" style="align-items:start">
  <div class="field" style="width:260px"><div class="slider-head"><label class="field-label" for="p-tempo">Tempo</label><output class="slider-value" for="p-tempo">83 bpm</output></div><input class="slider" id="p-tempo" type="range" min="40" max="160" value="83" style="--fill:36%"></div>
  <div class="field" style="width:260px"><div class="slider-head"><label class="field-label" for="p-level">Level</label><output class="slider-value" for="p-level" style="font:var(--type-numeral-lg);color:var(--accent)">44</output></div><input class="slider" id="p-level" type="range" min="1" max="100" value="44" style="--fill:43.4%"><p class="field-hint" style="min-height:2.8em"><b style="font:var(--type-title-sm);color:var(--text)">Key Signatures</b><br>Both hands, moderate rhythm</p></div>
</div>
</body>
</html>
