<!-- @dsCard group="Data" height=306 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Stat</title></head>
<body>
<div class="ds-stack">
  <div class="card stat-strip" style="padding:var(--space-8) var(--space-16);min-height:56px">
    <div class="stat is-key" style="flex:none;display:flex;align-items:baseline;gap:var(--space-12)"><span class="stat-value" style="font:var(--type-numeral-lg)">L44</span><span class="section-title">Key Signatures</span></div>
    <div class="stat"><span class="stat-label">Key</span><span class="stat-value is-text">A minor</span></div>
    <div class="stat"><span class="stat-label">Time</span><span class="stat-value is-text">4/4</span></div>
    <div class="stat"><span class="stat-label">Tempo</span><span class="stat-value is-text">83 bpm</span></div>
    <div class="stat"><span class="stat-label">Hands</span><span class="stat-value is-text">Both hands</span></div>
  </div>
  <div class="ds-row ds-card" style="align-items:stretch;border-radius:var(--radius-lg)">
    <dl class="stat" style="width:80px;justify-items:center"><dt class="stat-label">Accuracy</dt><dd class="stat-value">100%</dd></dl>
    <dl class="stat" style="width:80px;justify-items:center"><dt class="stat-label">Streak</dt><dd class="stat-value">24</dd></dl>
    <div class="stat stat-tile is-key" style="width:108px"><span class="stat-value">8/8</span><span class="stat-note">Chords on the beat</span></div>
    <div class="stat stat-tile" style="width:108px"><span class="stat-value">99%</span><span class="stat-note">Timing · 32 ms late</span></div>
    <div class="stat stat-tile stat-sm" style="width:108px"><span class="stat-value">10 ms</span><span class="stat-note">Keys together</span></div>
  </div>
  <div class="ds-row ds-panel" style="align-items:stretch">
    <div class="stat stat-tile stat-tile-card stat-sm" style="width:96px"><span class="stat-value">12,480</span><span class="stat-note">XP</span></div>
    <div class="stat stat-tile stat-tile-card stat-sm" style="width:96px"><span class="stat-value">6</span><span class="stat-note">Day streak</span></div>
  </div>
</div>
</body>
</html>
