<head><meta charset="utf-8"><title>PlanList</title></head>

<div class="ds-stack ds-card" style="max-width:720px">
  <ol class="plan-list">

    <li class="is-next"><span class="step-mark" aria-hidden="true">4</span><span class="plan-block-name">Rhythm</span><span class="plan-block-side num">5 min</span><span class="plan-block-why">Level 74. Featuring off-beat eighth, your weakest figure.</span></li>
  </ol>
</div>
