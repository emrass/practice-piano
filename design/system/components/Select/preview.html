<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Select</title></head>
<body>
<div class="ds-row ds-panel" style="align-items:start">
  <div class="field" style="width:200px"><label class="field-label" for="p-key">Key</label><select class="select" id="p-key"><option>Auto (by level)</option><option>C major</option><option>A minor</option></select></div>
  <div class="field" style="width:220px"><label class="field-label" for="p-size">Keyboard size</label><select class="select" id="p-size"><option>61 keys (C2–C7)</option><option>88 keys (A0–C8)</option></select><p class="field-hint">Match the piano you play on.</p></div>
</div>
</body>
</html>
